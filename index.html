<script>
'use strict';

const VERSION = '2026-11-17b';

/* ===== 外部ライブラリ =====
 * 文字の読み取り（OCR）は国立国会図書館の NDLOCR-Lite（onnxruntime-web で動かす）、
 * 使えないときの予備に Tesseract.js。単語の区切りと読みがなは kuromoji.js。
 * どれも使うときに読み込む（初回だけ合わせて約 65MB。あとはブラウザのキャッシュ・Cache Storage から）。
 * 写真は端末の中だけで読み取り、外へ送るのは調べることばだけ。
 */
const NDL_REPO = 'https://raw.githubusercontent.com/ndl-lab/ndlocr-lite/e57f7c6bd9cfb3de5f12f008e71ad2122bd44bfd';
const LIB = {
  ort: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/',
  ndlModel: `${NDL_REPO}/src/model/parseq-ndl-24x256-30-tiny-189epoch-tegaki3-r8data-202604.onnx`,
  ndlChars: 'ndl-chars.json',   // 同じ版の src/config/NDLmoji.yaml の charset_train を JSON にしたもの
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  kuromoji: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js',
  kuromojiDict: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/',
};

const scripts = {};
function loadScript(src) {
  return scripts[src] ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { delete scripts[src]; s.remove(); reject(new Error('ライブラリを読み込めませんでした')); };
    document.head.append(s);
  });
}

/* ===== 保存 =====
 * 設定・履歴・ブックマークは端末のブラウザ（localStorage）にだけ保存する。
 */
const STORE = 'camjisho';
function load(key, fallback) {
  try {
    const v = localStorage.getItem(`${STORE}-${key}`);
    return v == null ? fallback : JSON.parse(v);
  } catch (e) {
    return fallback;
  }
}
function save(key, value) {
  try {
    localStorage.setItem(`${STORE}-${key}`, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

const DICTS = ['ja', 'en', 'wiki'];
// dict: 使う辞書 / vert: 辞書ごとの縦書き・横書き / font: 文字サイズ 0〜3 / kanjiOnly: 撮ったあとに漢字のことばだけ出す
const SET = Object.assign({ dict: 'ja', vert: { ja: true, en: false, wiki: true }, font: 1, kanjiOnly: false }, load('settings', {}));
if (!DICTS.includes(SET.dict)) SET.dict = 'ja';
const saveSet = () => save('settings', SET);

const HIST_MAX = 300;
let HIST = load('history', []);     // [{ w: ことば, r: 読み, d: 辞書, s: 説明の頭, t: 時刻 }]（新しい順）
let MARKS = load('marks', []);      // [{ w, r, s, t }]

/* ===== 小物 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const KANJI = /[\p{Script=Han}々〆ヶ]/u;
const isLatin = w => /^[A-Za-z][A-Za-z'’ .-]*$/.test(w);
const isSingleKanji = w => [...w].length === 1 && KANJI.test(w);
const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ===== 動作の記録 =====
 * …/?debug で開くと、画面の上に記録を出す（実機で動かないときの調べ用。タップでコピー）。
 * 予期しないエラーは、いつも画面の下に短く出す。
 */
const DEBUG = /(^|[?&])debug\b/.test(location.search);
const LOGS = [];
const sec = t0 => `${((performance.now() - t0) / 1000).toFixed(1)}秒`;
function log(msg) {
  LOGS.push(`${(performance.now() / 1000).toFixed(1)} ${msg}`);
  if (LOGS.length > 300) LOGS.shift();
  if (!DEBUG) return;
  const el = $('debugLog');
  el.hidden = false;
  el.textContent = LOGS.join('\n');
  el.scrollTop = el.scrollHeight;
}
window.addEventListener('error', e => {
  log(`エラー: ${e.message} (${String(e.filename || '').split('/').pop()}:${e.lineno})`);
  toast(`エラー: ${e.message}`);
});
window.addEventListener('unhandledrejection', e => log(`エラー: ${e.reason?.message || e.reason}`));
if (DEBUG) {
  // 画面が止まっていた時間も記録する（重い処理が表で動いていないか）
  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (now - last > 1500) log(`画面が ${((now - last) / 1000).toFixed(1)} 秒止まっていた`);
    last = now;
  }, 500);
}

/* ===== 画面 ===== */
const S = {
  view: '',
  text: '',          // 直近に読み取った（直した）文
  tokens: [],        // その文を区切ったことば [{ s: 表記, b: 調べる形, r: 読み }]
  cur: null,         // 辞書画面で表示中のことば { w, r, s }
  seq: 0,            // 調べるたびに増やす（遅れて届いた古い結果を捨てる）
  shot: 0,           // 撮るたびに増やす（閉じたあとに届いた読み取り結果を捨てる）
  histTab: 'hist',
  preloaded: false,  // 読み取りと区切りの辞書を読み込みはじめたか
  libsLoading: false,
};

function show(view) {
  if (view === 'scan' && S.view === 'scan') return;
  S.view = view;
  for (const v of ['scan', 'dict', 'hist']) $(`v-${v}`).hidden = v !== view;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'scan') {
    closeSheet();
    layoutFrame();
  } else {
    Cam.stop();
  }
  if (view === 'dict' && !S.cur) renderDictEmpty();
  if (view === 'hist') renderHist();
}

function setDict(d) {
  if (!DICTS.includes(d)) return;
  const changed = SET.dict !== d;
  SET.dict = d;
  saveSet();
  document.querySelectorAll('#dictSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.dict === d);
    b.setAttribute('aria-selected', b.dataset.dict === d);
  });
  updateDir();
  if (!changed) return;
  if (S.view === 'dict' && S.cur) openWord(S.cur.w, { r: S.cur.r });
}

/* ===== カメラ =====
 * mode: 'video'（カメラ）/ 'photo'（選んだ写真）
 * view: 画面上の拡大と移動。ハードウェアのズームが使えないときと、写真のときに使う
 */
const Cam = {
  mode: 'video',
  stream: null,
  track: null,
  starting: false,
  frozen: false,
  hw: null,                 // ハードウェアのズーム { min, max, value }
  torch: false,
  view: { z: 1, tx: 0, ty: 0 },

  async start() {
    if (this.mode !== 'video' || this.stream || this.starting || this.frozen) return;
    if (!navigator.mediaDevices?.getUserMedia) {
      camMessage(window.isSecureContext ? 'このブラウザではカメラを使えません。' : 'カメラは https のページでだけ使えます。');
      return;
    }
    this.starting = true;
    renderStatus();
    log('カメラ: 起動');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
      log(`カメラ: 許可された（${stream.getVideoTracks()[0]?.label || '名前なし'}）`);
      // 許可を待つあいだに別の画面へ移っていたら、すぐ止める
      if (S.view !== 'scan' || document.hidden || this.mode !== 'video' || this.frozen) {
        log('カメラ: 画面が変わっていたので止める');
        stream.getTracks().forEach(t => t.stop());
        return;
      }
      this.stream = stream;
      this.track = stream.getVideoTracks()[0];
      $('video').srcObject = stream;
      const caps = this.track.getCapabilities?.() || {};
      this.hw = caps.zoom && caps.zoom.max > caps.zoom.min
        ? { min: caps.zoom.min, max: Math.min(caps.zoom.max, caps.zoom.min * 8), value: this.track.getSettings?.().zoom || caps.zoom.min }
        : null;
      if (this.hw) this.view = { z: 1, tx: 0, ty: 0 };
      $('btnTorch').classList.toggle('ghost', !caps.torch);
      this.torch = false;
      $('btnTorch').classList.remove('on');
      applyView();
      await this.play();
    } catch (e) {
      log(`カメラ: ${e.name} ${e.message}`);
      camMessage(e.name === 'NotAllowedError'
        ? 'カメラの使用が許可されていません。設定でカメラを許可するか、写真から読み取ってください。'
        : 'カメラを起動できませんでした。写真から読み取ることもできます。');
      setTimeout(preloadAll, 300);
    } finally {
      this.starting = false;
      renderStatus();
    }
  },

  // 映像を流しはじめ、実際に絵が届くまで待つ。省電力モードなどで自動再生が止められたら、タップしてもらう
  async play() {
    const video = $('video'), stream = this.stream;
    if (!stream) return;
    camMessage('');
    try {
      await video.play();
    } catch (e) {
      if (this.stream !== stream) return;      // 途中でカメラを止めた
      log(`カメラ: 再生が止められた（${e.name}）`);
      camMessage('下のボタンを押すと、カメラの映像が映ります。', 'カメラを映す');
      return;
    }
    for (let i = 0; i < 30 && !(video.readyState >= 2 && video.videoWidth); i++) await new Promise(r => setTimeout(r, 200));
    if (this.stream !== stream) return;
    if (video.readyState >= 2 && video.videoWidth) {
      log(`カメラ: 映像 ${video.videoWidth}×${video.videoHeight}`);
      setTimeout(preloadAll, 300);
    } else {
      log(`カメラ: 映像が届かない（readyState ${video.readyState}）`);
      camMessage('カメラの映像が届きません。', 'もう一度');
    }
  },

  stop() {
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
    this.track = null;
    $('video').srcObject = null;
  },

  // 撮った瞬間の画面を止めて見せ、カメラは切る
  freeze() {
    const video = $('video'), c = $('freeze');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    c.style.transform = video.style.transform;
    c.hidden = false;
    this.frozen = true;
    this.stop();
  },
  unfreeze() {
    $('freeze').hidden = true;
    this.frozen = false;
  },

  // 読み取りに使う画像と、その大きさ
  source() {
    if (this.mode === 'photo') {
      const img = $('still');
      return img.naturalWidth ? { el: img, w: img.naturalWidth, h: img.naturalHeight } : null;
    }
    const video = $('video');
    return video.readyState >= 2 && video.videoWidth ? { el: video, w: video.videoWidth, h: video.videoHeight } : null;
  },

  openPhoto(file) {
    this.stop();
    this.unfreeze();
    closeSheet(false);
    const img = $('still');
    if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(file);
    img.hidden = false;
    $('video').hidden = true;
    $('btnBack').hidden = false;
    this.mode = 'photo';
    this.view = { z: 1, tx: 0, ty: 0 };
    applyView();
    camMessage('');
    updateHint();
  },
  backToCamera() {
    const img = $('still');
    if (img.src) URL.revokeObjectURL(img.src);
    img.removeAttribute('src');
    img.hidden = true;
    $('video').hidden = false;
    $('btnBack').hidden = true;
    this.mode = 'video';
    this.view = { z: 1, tx: 0, ty: 0 };
    applyView();
    updateHint();
    this.start();
  },

  async zoomBy(f) {
    let shown;
    if (this.mode === 'video' && this.hw && this.track) {
      const z = clamp(this.hw.value * f, this.hw.min, this.hw.max);
      try {
        await this.track.applyConstraints({ advanced: [{ zoom: z }] });
        this.hw.value = z;
        shown = z / this.hw.min;
      } catch (e) {
        this.hw = null;     // 効かなければ画面上の拡大に切り替える
      }
    }
    if (shown == null) {
      const v = this.view, z = clamp(v.z * f, this.mode === 'photo' ? 0.4 : 1, 8), k = z / v.z;
      v.tx *= k;            // 画面の中心を動かさずに拡大する
      v.ty *= k;
      v.z = z;
      applyView();
      shown = z;
    }
    const b = $('zoomBadge');
    b.textContent = `${shown.toFixed(1)}×`;
    b.classList.add('show');
    clearTimeout(b.timer);
    b.timer = setTimeout(() => b.classList.remove('show'), 900);
  },

  async toggleTorch() {
    if (!this.track) return;
    try {
      await this.track.applyConstraints({ advanced: [{ torch: !this.torch }] });
      this.torch = !this.torch;
      $('btnTorch').classList.toggle('on', this.torch);
    } catch (e) {
      toast('ライトを使えませんでした');
    }
  },
};

function applyView() {
  const v = Cam.view, t = `translate(${v.tx}px, ${v.ty}px) scale(${v.z})`;
  $('video').style.transform = t;
  $('still').style.transform = t;
}

function camMessage(msg, retry = 'もう一度') {
  $('camMsg').hidden = !msg;
  $('camMsgText').textContent = msg;
  $('camRetry').textContent = retry;
  renderStatus();
}

// カメラの下に出す、いま何をしているかの短い表示
function renderStatus() {
  const msg = Cam.starting && Cam.mode === 'video' ? 'カメラを起動中…'
    : S.libsLoading && NDL.progress != null ? `文字を読む辞書を読み込み中… ${Math.round(NDL.progress * 100)}%（初回のみ）`
    : S.libsLoading ? '文字を読む準備中…（初回のみ・約65MB）' : '';
  $('camStatus').textContent = msg;
  $('camStatus').hidden = !msg || !$('camMsg').hidden || !$('sheet').hidden;
}

// 読み取りと区切りの辞書を裏で読み込んでおく（初回の待ち時間を減らす）。カメラが映ってから始める
function preloadAll() {
  if (S.preloaded) return;
  S.preloaded = true;
  S.libsLoading = true;
  renderStatus();
  const t0 = performance.now();
  log('準備: 文字の読み取りと区切りの辞書を読み込む');
  NDL.onProgress ||= renderStatus;
  Promise.allSettled([
    getTokenizer().then(() => log(`準備: 区切りの辞書 OK（${sec(t0)}）`)),
    // NDLOCR-Lite が使えなければ、予備の Tesseract を読み込んでおく
    NDL.init().then(() => log(`準備: 文字の読み取り OK（${sec(t0)}）`), e => { OCR.preload(); throw e; }),
  ]).then(rs => {
    rs.filter(r => r.status === 'rejected').forEach(r => log(`準備: 失敗 ${r.reason?.message || r.reason}`));
    S.libsLoading = false;
    renderStatus();
  });
}

// 写真は指で動かす・2本指で拡大縮小する
const pointers = new Map();
let pinch = null;
function onPointerDown(e) {
  if (Cam.mode !== 'photo' || !$('sheet').hidden || e.target.closest('button')) return;
  $('cam').setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  pinch = null;
}
function onPointerMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const v = Cam.view;
  if (pointers.size === 1) {
    v.tx += e.clientX - p.x;
    v.ty += e.clientY - p.y;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()].map(q => (q === p ? { x: e.clientX, y: e.clientY } : q));
    const r = $('cam').getBoundingClientRect();
    const mid = { x: (a.x + b.x) / 2 - r.left - r.width / 2, y: (a.y + b.y) / 2 - r.top - r.height / 2 };
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) {
      const z = clamp(v.z * dist / pinch.dist, 0.4, 8), k = z / v.z;
      // 2本の指の中点の下にある所を動かさずに拡大し、中点の移動ぶん動かす
      v.tx = mid.x - k * (pinch.mid.x - v.tx);
      v.ty = mid.y - k * (pinch.mid.y - v.ty);
      v.z = z;
    }
    pinch = { dist, mid };
  }
  p.x = e.clientX;
  p.y = e.clientY;
  applyView();
}
function onPointerUp(e) {
  pointers.delete(e.pointerId);
  pinch = null;
}

/* ===== 読み取る範囲 =====
 * 枠の中の、点線と点線のあいだ（1行ぶん）だけを読み取る。
 * 縦書きは上の ▼ から下へ、横書きは左の ▶ から右へ。
 */
let BAND = null;     // 点線のあいだ（#cam の中の座標）

function layoutFrame() {
  const cam = $('cam'), W = cam.clientWidth, H = cam.clientHeight;
  if (!W || !H) return;
  const vert = SET.vert[SET.dict];
  const top = 66, bottom = H - 126;          // 上の切り替えボタンと下のボタンの分をあける
  const room = Math.max(120, bottom - top);
  let f, b;
  if (vert) {
    const fw = clamp(W * 0.56, 150, 340), fh = clamp(room, 140, 760);
    f = { x: (W - fw) / 2, y: top + (room - fh) / 2, w: fw, h: fh };
    const bw = Math.round(fw * 0.32);
    b = { x: f.x + (fw - bw) / 2, y: f.y, w: bw, h: fh };
  } else {
    const fw = clamp(W * 0.84, 220, 600), fh = clamp(Math.min(fw * 0.46, room), 90, 230);
    f = { x: (W - fw) / 2 + 6, y: top + (room - fh) / 2, w: fw, h: fh };
    const bh = Math.round(fh * 0.36);
    b = { x: f.x, y: f.y + (fh - bh) / 2, w: fw, h: bh };
  }
  BAND = b;
  const frame = $('frame'), band = $('band'), arrow = $('arrow');
  frame.className = vert ? 'v' : 'h';
  Object.assign(frame.style, { left: `${f.x}px`, top: `${f.y}px`, width: `${f.w}px`, height: `${f.h}px` });
  Object.assign(band.style, { left: `${b.x - f.x}px`, top: `${b.y - f.y}px`, width: `${b.w}px`, height: `${b.h}px` });
  arrow.className = vert ? 'v' : 'h';
  Object.assign(arrow.style, vert
    ? { left: `${b.x + b.w / 2 - 13}px`, top: `${f.y - 22}px` }
    : { left: `${f.x - 22}px`, top: `${b.y + b.h / 2 - 13}px` });
}

function updateDir() {
  const vert = SET.vert[SET.dict];
  $('dirLabel').textContent = vert ? '縦書き' : '横書き';
  updateHint();
  layoutFrame();
}
function updateHint() {
  $('hint').textContent = Cam.mode === 'photo'
    ? '写真を指で動かして、読みたい行を点線のあいだに入れてください'
    : `先頭の文字を ${SET.vert[SET.dict] ? '▼' : '▶'} に合わせて撮ってください`;
}

// 点線のあいだを、写真の色のまま切り出す（行の太さ方向を RAW_THICK px ほどにそろえる）
const RAW_THICK = 160;
function cropBand(src, vert) {
  const cam = $('cam'), W = cam.clientWidth, H = cam.clientHeight, v = Cam.view;
  if (!BAND) return null;
  // 画面の座標 → 画像の座標（object-fit:cover と拡大・移動を戻す）
  const s = Math.max(W / src.w, H / src.h), ox = (W - src.w * s) / 2, oy = (H - src.h * s) / 2;
  const toSrc = (x, y) => [
    (W / 2 + (x - W / 2 - v.tx) / v.z - ox) / s,
    (H / 2 + (y - H / 2 - v.ty) / v.z - oy) / s,
  ];
  const b = BAND;
  let [x0, y0] = toSrc(b.x, b.y), [x1, y1] = toSrc(b.x + b.w, b.y + b.h);
  x0 = clamp(x0, 0, src.w); x1 = clamp(x1, 0, src.w);
  y0 = clamp(y0, 0, src.h); y1 = clamp(y1, 0, src.h);
  const sw = x1 - x0, sh = y1 - y0;
  if (sw < 8 || sh < 8) return null;
  const k = clamp(RAW_THICK / (vert ? sw : sh), 0.2, 3);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k);
  c.height = Math.round(sh * k);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src.el, x0, y0, sw, sh, 0, 0, c.width, c.height);
  return c;
}

// Tesseract 用（予備）: 行の太さを OCR_THICK にそろえ、白黒にして影や照明のむらをならす
const OCR_THICK = 150;
function tesseractInput(raw, vert) {
  const k = OCR_THICK / (vert ? raw.width : raw.height);
  const w = Math.round(raw.width * k), h = Math.round(raw.height * k);
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  g.drawImage(raw, 0, 0, w, h);
  enhance(g, w, h);
  // まわりに白い余白を付ける（文字が端に接していると読み取りにくい）
  const pad = Math.round(OCR_THICK * 0.2), out = document.createElement('canvas');
  out.width = w + pad * 2;
  out.height = h + pad * 2;
  const og = out.getContext('2d');
  og.fillStyle = '#fff';
  og.fillRect(0, 0, out.width, out.height);
  og.drawImage(c, pad, pad);
  return out;
}

// 白黒にして、影や照明のむらをならし、濃淡を広げる
function enhance(g, w, h) {
  const img = g.getImageData(0, 0, w, h), d = img.data, n = w * h;
  const gray = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) gray[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;

  // 紙の明るさを区画ごとに見積もる（区画の中の明るいほうから 1 割の所）
  const bs = Math.max(12, Math.round(Math.min(w, h) / 2));
  const gw = Math.ceil(w / bs), gh = Math.ceil(h / bs), paper = new Float32Array(gw * gh);
  const hist = new Uint32Array(64);
  for (let by = 0; by < gh; by++) {
    for (let bx = 0; bx < gw; bx++) {
      hist.fill(0);
      let cnt = 0;
      for (let y = by * bs; y < Math.min(h, (by + 1) * bs); y++) {
        for (let x = bx * bs; x < Math.min(w, (bx + 1) * bs); x++) { hist[gray[y * w + x] >> 2]++; cnt++; }
      }
      let acc = 0, bin = 63;
      for (; bin > 0 && (acc += hist[bin]) < cnt * 0.1; bin--);
      paper[by * gw + bx] = Math.max(24, bin * 4 + 2);
    }
  }
  // 区画のあいだはなめらかにつなぐ
  const at = (x, y) => paper[clamp(y, 0, gh - 1) * gw + clamp(x, 0, gw - 1)];
  const out = new Float32Array(n), hist2 = new Uint32Array(256);
  for (let y = 0; y < h; y++) {
    const fy = (y + 0.5) / bs - 0.5, y0 = Math.floor(fy), ty = fy - y0;
    for (let x = 0; x < w; x++) {
      const fx = (x + 0.5) / bs - 0.5, x0 = Math.floor(fx), tx = fx - x0;
      const p = (at(x0, y0) * (1 - tx) + at(x0 + 1, y0) * tx) * (1 - ty) + (at(x0, y0 + 1) * (1 - tx) + at(x0 + 1, y0 + 1) * tx) * ty;
      const val = clamp(gray[y * w + x] / p * 255, 0, 255);
      out[y * w + x] = val;
      hist2[val | 0]++;
    }
  }
  // 暗いほうの 1% を黒、明るいほうの 2% を白にそろえる
  let lo = 0, hi = 255, acc = 0;
  for (; lo < 254 && (acc += hist2[lo]) < n * 0.01; lo++);
  acc = 0;
  for (; hi > lo + 1 && (acc += hist2[hi]) < n * 0.02; hi--);
  if (hi - lo < 24) { lo = 0; hi = 255; }
  const f = 255 / (hi - lo);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const val = clamp((out[i] - lo) * f, 0, 255);
    d[j] = d[j + 1] = d[j + 2] = val;
    d[j + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

/* ===== 文字の読み取り（NDLOCR-Lite） =====
 * 国立国会図書館の NDLOCR-Lite（CC BY 4.0）の文字列認識モデル（PARSeq、ONNX 約36MB）を、
 * onnxruntime-web で Worker の中で動かす。本の文字に強く、Tesseract が読み違える「所謂」「哲学」なども読める。
 * 1行の画像を 256×24 に縮めて読む（縦書きは左へ 90° 回して横にする。NDLOCR-Lite の parseq.py と同じ）。30字まで。
 * 白黒に整えると逆に崩れるので、写真の色のまま渡す。
 * モデルは初回に読み込んで Cache Storage に保存し、次からはそこから使う。
 * 使えないとき（読み込めない、Worker で動かない など）は、この起動のあいだは Tesseract.js で読む。
 */
const NDL_W = 256, NDL_H = 24;
const NDL = {
  ready: null,
  worker: null,
  chars: null,       // 出力の番号 → 文字（0 は終わりの印なので、番号 n は chars[n - 1]）
  progress: null,    // モデルの読み込みの進み具合 0〜1（読み込み中でなければ null）
  broken: false,     // 使えなかった（この起動のあいだは Tesseract で読む）
  onProgress: null,
  waiting: new Map(),
  seq: 0,

  init() {
    return this.ready ||= new Promise((resolve, reject) => {
      const t0 = performance.now();
      log('NDLOCR-Lite: 準備');
      const url = URL.createObjectURL(new Blob([ndlWorkerSource()], { type: 'text/javascript' }));
      let w = null;
      const fail = err => {
        w?.terminate();
        URL.revokeObjectURL(url);
        this.waiting.forEach(cb => cb.reject(err));
        this.waiting.clear();
        this.worker = null;
        this.progress = null;
        this.broken = true;
        log(`NDLOCR-Lite: 使えない（${err.message}）`);
        this.onProgress?.();
        reject(err);
      };
      try {
        w = new Worker(url);
      } catch (e) {
        fail(e);
        return;
      }
      w.onmessage = e => {
        const d = e.data;
        if (d.type === 'progress') {
          this.progress = d.p;
          this.onProgress?.();
        } else if (d.type === 'ready') {
          URL.revokeObjectURL(url);
          this.worker = w;
          this.progress = null;
          log(`NDLOCR-Lite: OK（モデル${d.cached ? 'は保存済み' : 'を読み込み'} ${d.load}ms・準備 ${d.init}ms・計 ${sec(t0)}）`);
          this.onProgress?.();
          resolve();
        } else if (d.id == null) {
          fail(new Error(d.error));
        } else {
          const cb = this.waiting.get(d.id);
          this.waiting.delete(d.id);
          if (d.type === 'error') cb?.reject(new Error(d.error));
          else cb?.resolve(d);
        }
      };
      w.onerror = e => {
        e.preventDefault();
        fail(new Error(e.message || 'Worker で動きませんでした'));
      };
      fetch(LIB.ndlChars)
        .then(r => {
          if (!r.ok) throw new Error(`文字の一覧を読み込めませんでした（HTTP ${r.status}）`);
          return r.json();
        })
        .then(list => {
          this.chars = list;
          w.postMessage({ type: 'init', model: LIB.ndlModel });
        }, fail);
    });
  },

  // canvas: 点線のあいだを色のまま切り出したもの → { text, full（30字で切れたかもしれない）}
  async read(canvas, vert) {
    if (this.broken) throw new Error('この起動では使えません');
    await this.init();
    const x = ndlInput(canvas, vert);
    const d = await new Promise((resolve, reject) => {
      const id = ++this.seq;
      this.waiting.set(id, { resolve, reject });
      this.worker.postMessage({ type: 'read', id, x, w: NDL_W, h: NDL_H }, [x.buffer]);
    });
    log(`NDLOCR-Lite: 読み取り ${d.ms}ms`);
    return { text: d.ids.map(i => this.chars[i - 1] ?? '').join(''), full: d.full };
  },
};

// 縦書きは左へ 90° 回して横にし、256×24 に縮め、RGB を -1〜1 にした CHW の並びにする
function ndlInput(src, vert) {
  const r = document.createElement('canvas');
  r.width = vert ? src.height : src.width;
  r.height = vert ? src.width : src.height;
  const rg = r.getContext('2d');
  if (vert) {
    rg.translate(0, r.height);
    rg.rotate(-Math.PI / 2);
  }
  rg.drawImage(src, 0, 0);
  const c = document.createElement('canvas');
  c.width = NDL_W;
  c.height = NDL_H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  g.drawImage(r, 0, 0, NDL_W, NDL_H);
  const d = g.getImageData(0, 0, NDL_W, NDL_H).data, n = NDL_W * NDL_H, x = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) for (let ch = 0; ch < 3; ch++) x[ch * n + i] = d[i * 4 + ch] / 127.5 - 1;
  return x;
}

// Worker の中身。モデルは Cache Storage に保存して、次からはそこから読む
function ndlWorkerSource() {
  return `importScripts(${JSON.stringify(`${LIB.ort}ort.min.js`)});
ort.env.wasm.wasmPaths = ${JSON.stringify(LIB.ort)};
ort.env.wasm.numThreads = 1;
let session = null;
async function loadModel(url) {
  let cache = null;
  try { cache = await caches.open('camjisho-ndl'); } catch (e) {}
  const hit = cache && await cache.match(url);
  if (hit) return { buf: new Uint8Array(await hit.arrayBuffer()), cached: true };
  const res = await fetch(url);
  if (!res.ok) throw new Error('モデルを読み込めませんでした（HTTP ' + res.status + '）');
  const total = +res.headers.get('content-length') || 0, parts = [];
  let loaded = 0, last = 0;
  const reader = res.body.getReader();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    loaded += value.length;
    if (total && loaded - last > 1048576) { last = loaded; postMessage({ type: 'progress', p: loaded / total }); }
  }
  const buf = new Uint8Array(loaded);
  let at = 0;
  for (const p of parts) { buf.set(p, at); at += p.length; }
  if (cache) await cache.put(url, new Response(buf)).catch(() => {});
  return { buf, cached: false };
}
onmessage = async e => {
  const d = e.data;
  try {
    if (d.type === 'init') {
      const t0 = performance.now();
      const { buf, cached } = await loadModel(d.model);
      const t1 = performance.now();
      session = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
      postMessage({ type: 'ready', cached, load: Math.round(t1 - t0), init: Math.round(performance.now() - t1) });
    } else if (d.type === 'read') {
      const t0 = performance.now();
      const out = (await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', d.x, [1, 3, d.h, d.w]) }))[session.outputNames[0]];
      const T = out.dims[1], C = out.dims[2], ids = [];
      for (let t = 0; t < T; t++) {
        let best = 0, top = -Infinity;
        for (let k = 0; k < C; k++) { const v = out.data[t * C + k]; if (v > top) { top = v; best = k; } }
        if (best === 0) break;
        ids.push(best);
      }
      postMessage({ type: 'result', id: d.id, ids, full: ids.length >= T, ms: Math.round(performance.now() - t0) });
    }
  } catch (err) {
    postMessage({ type: 'error', id: d.id, error: String((err && err.message) || err) });
  }
};`;
}

/* ===== 文字の読み取り（Tesseract.js、予備） =====
 * NDLOCR-Lite が使えないときに使う。
 * 縦書きは jpn_vert、横書きは jpn（英和・和英では eng+jpn）。言語の辞書は初回だけ各 2〜3MB を読み込む。
 */
const OCR = {
  worker: null,
  langs: '',
  pending: null,    // 準備中の worker
  running: null,    // 読み取り中
  onProgress: null,

  langsFor(vert, dict) {
    return vert ? 'jpn_vert' : dict === 'en' ? 'eng+jpn' : 'jpn';
  },

  async get(langs) {
    while (this.pending) await this.pending.catch(() => {});
    if (this.worker && this.langs === langs) return this.worker;
    this.pending = (async () => {
      await loadScript(LIB.tesseract);
      if (this.running) await this.running.catch(() => {});
      if (this.worker) {
        const old = this.worker;
        this.worker = null;
        this.langs = '';
        old.terminate().catch(() => {});
      }
      log(`読み取り: ${langs} を準備`);
      let status = '';
      const w = await Tesseract.createWorker(langs, 1, {
        logger: m => {
          this.onProgress?.(m);
          if (m.status !== status) log(`読み取り: ${status = m.status}`);
        },
        errorHandler: e => log(`読み取り: エラー ${e?.message || e}`),
      });
      this.worker = w;
      this.langs = langs;
      return w;
    })();
    try {
      return await this.pending;
    } finally {
      this.pending = null;
    }
  },

  preload() {
    this.get(this.langsFor(SET.vert[SET.dict], SET.dict)).catch(() => {});
  },

  async read(canvas, vert, dict) {
    const w = await this.get(this.langsFor(vert, dict));
    const job = (async () => {
      await w.setParameters({
        tessedit_pageseg_mode: vert ? '5' : '7',   // 5: 縦書きの1ブロック / 7: 横書きの1行
        preserve_interword_spaces: '1',
        user_defined_dpi: '300',
      });
      const { data } = await w.recognize(canvas);
      return data;
    })();
    this.running = job;
    try {
      return await job;
    } finally {
      if (this.running === job) this.running = null;
    }
  },
};

// 読み取った文字を整える（日本語の文字のあいだの空白や改行を詰める）
const JP = '\\p{Script=Han}\\p{Script=Hiragana}\\p{Script=Katakana}ー々〆〇、。・「」『』（）〈〉《》【】〔〕…';
const JP_GAP = new RegExp(`([${JP}])\\s+(?=[${JP}])`, 'gu');
function cleanText(t, vert) {
  t = t.normalize('NFKC').replace(/[|｜_]+/g, ' ');
  t = vert ? t.replace(/\s*\n\s*/g, '') : t.replace(/\s*\n\s*/g, ' ');
  // 帯の端のかすれを読んだ「-」などは落とす
  return t.replace(JP_GAP, '$1').replace(/[ \t]{2,}/g, ' ').replace(/^[\s\-–—_~]+|[\s\-–—_~]+$/g, '');
}

/* ===== 単語の区切りと読みがな（kuromoji.js） =====
 * 辞書は約 17MB。展開に数秒かかり、表でやると画面が固まるので、Worker の中で読み込んで区切る。
 * 読めないときは Intl.Segmenter で区切るだけにする（読みがななし）。
 * tokenize(text) → [[表記, 品詞, 品詞細分類1, 基本形, 読み, 位置（0から）], …]
 */
let tokenizerP = null;
function getTokenizer() {
  return tokenizerP ||= new Promise((resolve, reject) => {
    const src = `importScripts(${JSON.stringify(LIB.kuromoji)});
kuromoji.builder({ dicPath: ${JSON.stringify(LIB.kuromojiDict)} }).build((err, tk) => {
  if (err) { postMessage({ error: String((err && err.message) || err) }); return; }
  onmessage = e => postMessage({ id: e.data.id,
    tokens: tk.tokenize(e.data.text).map(t => [t.surface_form, t.pos, t.pos_detail_1, t.basic_form, t.reading, t.word_position - 1]) });
  postMessage({ ready: true });
});`;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const worker = new Worker(url);
    const waiting = new Map();
    let seq = 0;
    const fail = err => {
      worker.terminate();
      URL.revokeObjectURL(url);
      waiting.forEach(done => done([]));
      waiting.clear();
      tokenizerP = null;
      reject(err);
    };
    worker.onmessage = e => {
      const d = e.data;
      if (d.ready) {
        URL.revokeObjectURL(url);
        resolve({
          tokenize: text => new Promise(done => {
            const id = ++seq;
            waiting.set(id, done);
            worker.postMessage({ id, text });
          }),
        });
      } else if (d.error) {
        fail(new Error(d.error));
      } else if (waiting.has(d.id)) {
        waiting.get(d.id)(d.tokens);
        waiting.delete(d.id);
      }
    };
    worker.onerror = e => {
      e.preventDefault();
      fail(new Error(e.message || '区切りの辞書を読み込めませんでした'));
    };
  });
}

/* kuromoji（IPA 辞書）は「所謂」→「所／謂」、「卓越せる」→「卓／越せる」のように、漢字の熟語を分けすぎることがある。
 * ブラウザ内蔵の区切り（Intl.Segmenter）は熟語に強い（活用する語には弱い）ので、それが漢字だけの1語とした所を1つにまとめる。
 * 語の終わりが kuromoji の語の途中なら、残りのかな（「せる」）を別の語にする。
 * 数や接頭詞を含む所（第二）はまとめない（もとの区切りのほうが読みがなが正しい）。
 */
const HAN_WORD = /^[\p{Script=Han}々〆ヶ]{2,}$/u;
async function joinCompounds(seg, toks, tk) {
  if (!window.Intl?.Segmenter) return toks;
  const out = [];
  let i = 0;
  for (const w of new Intl.Segmenter('ja', { granularity: 'word' }).segment(seg)) {
    if (!HAN_WORD.test(w.segment)) continue;
    const end = w.index + w.segment.length;
    while (i < toks.length && toks[i].at < w.index) out.push(toks[i++]);
    if (toks[i]?.at !== w.index) continue;                 // 語の頭がずれている
    let j = i;
    while (j < toks.length && toks[j].at + toks[j].s.length <= end) j++;
    const next = toks[j], cut = next && next.at < end ? end - next.at : 0;
    const rest = cut ? next.s.slice(cut) : '';
    if (cut && !/^\p{Script=Hiragana}+$/u.test(rest)) continue;
    const parts = toks.slice(i, cut ? j + 1 : j);
    if (parts.length < 2 || parts.some(t => t.detail === '数' || t.pos === '接頭詞')) continue;
    // 読み: 熟語だけで区切りなおして1語になればその読み。2字以上の名詞と接尾語だけなら（研究＋室）読みをつなぐ。
    // それ以外（1字ずつの 所＋謂 →「ところいい」）は読みがなを付けない
    const one = await tk.tokenize(w.segment);
    const nouns = !cut && parts.every(t => t.pos === '名詞' && (t.s.length >= 2 || t.detail === '接尾')
      && !['非自立', '固有名詞'].includes(t.detail) && t.reading && t.reading !== '*');
    const reading = one.length === 1 ? one[0][4] : nouns ? parts.map(t => t.reading).join('') : '';
    out.push({ s: w.segment, pos: '名詞', base: w.segment, reading, at: w.index });
    if (cut) toks[j] = { s: rest, pos: next.pos, detail: '', base: rest, reading: '', at: end };
    i = j;
  }
  return out.concat(toks.slice(i));
}

// join: kuromoji が分けすぎた漢字の熟語を1語にまとめる
async function toTokens(text, { join = true } = {}) {
  const tk = await getTokenizer().catch(e => { log(`区切り: ${e.message}`); return null; });
  const out = [];
  const pushJa = async seg => {
    if (!seg.trim()) return;
    if (tk) {
      let toks = (await tk.tokenize(seg)).map(([s, pos, detail, base, reading, at]) => ({ s, pos, detail, base, reading, at }));
      if (join) toks = await joinCompounds(seg, toks, tk);
      for (const { s, pos, base, reading } of toks) {
        if (pos === '記号' || /^[\p{P}\p{S}\s]+$/u.test(s)) continue;
        const r = KANJI.test(s) && reading && reading !== '*' ? kataToHira(reading) : '';
        out.push({ s, b: base && base !== '*' ? base : s, r });
      }
    } else if (window.Intl?.Segmenter) {
      for (const x of new Intl.Segmenter('ja', { granularity: 'word' }).segment(seg)) {
        if (x.isWordLike) out.push({ s: x.segment, b: x.segment, r: '' });
      }
    } else {
      out.push({ s: seg.trim(), b: seg.trim(), r: '' });
    }
  };
  // 英字の語はそのまま1語にし、それ以外を kuromoji で区切る
  let last = 0;
  for (const m of text.matchAll(/[A-Za-z](?:[A-Za-z'’-]*[A-Za-z])?/g)) {
    await pushJa(text.slice(last, m.index));
    out.push({ s: m[0], b: m[0], r: '' });
    last = m.index + m[0].length;
  }
  await pushJa(text.slice(last));
  return out;
}

// 読みは、kuromoji がそのことばを1語として知っているときだけ出す
// （「所謂」を「所＋謂」に分けて「ところいい」とするような、つなぎ合わせの読みは出さない。国語では辞書の読みを使う）
async function readingOf(word) {
  if (!KANJI.test(word)) return '';
  const tk = await getTokenizer().catch(() => null);
  if (!tk) return '';
  const ts = await tk.tokenize(word);
  if (ts.length !== 1 || !ts[0][4] || ts[0][4] === '*') return '';
  return kataToHira(ts[0][4]);
}

/* ===== 撮って読み取る ===== */
async function shoot() {
  const src = Cam.source();
  if (!src) {
    toast(Cam.mode === 'photo' ? '写真を読み込んでいます' : 'カメラの準備ができていません');
    return;
  }
  const vert = SET.vert[SET.dict];
  const raw = cropBand(src, vert);
  if (!raw) {
    toast('点線のあいだに写真が入っていません');
    return;
  }
  if (Cam.mode === 'video') Cam.freeze();
  const shot = ++S.shot;
  log(`撮影: ${raw.width}×${raw.height}（${vert ? '縦' : '横'}・${SET.dict}）`);
  const t0 = performance.now();
  openSheet();
  showCrop(raw, vert);
  sheetStatus('読み取り中…', null);
  NDL.onProgress = () => {
    renderStatus();
    if (shot === S.shot && NDL.progress != null) sheetStatus('文字を読む辞書を読み込み中…（初回のみ・約36MB）', NDL.progress);
  };
  OCR.onProgress = m => {
    if (shot !== S.shot) return;
    if (m.status === 'recognizing text') sheetStatus('読み取り中…', m.progress);
    else if (m.status === 'loading language traineddata') sheetStatus('文字の辞書を読み込み中…（初回のみ）', m.progress);
    else sheetStatus('読み取りの準備中…', null);
  };
  try {
    let text, how;
    try {
      const r = await NDL.read(raw, vert);
      text = r.text;
      how = r.full ? 'NDLOCR-Lite・30字で切れたかも' : 'NDLOCR-Lite';
    } catch (e) {
      if (shot !== S.shot) return;
      log(`撮影: NDLOCR-Lite で読めない（${e?.message || e}）→ Tesseract で読む`);
      sheetStatus('読み取り中…', 0);
      const data = await OCR.read(tesseractInput(raw, vert), vert, SET.dict);
      text = data.text || '';
      how = `Tesseract・確信度 ${Math.round(data.confidence ?? 0)}`;
    }
    if (shot !== S.shot) return;
    text = cleanText(text, vert);
    log(`撮影: 「${text}」（${how}・${sec(t0)}）`);
    sheetStatus('ことばに区切っています…', null);
    await setText(text);
    if (shot !== S.shot) return;
    if (!S.tokens.length) {
      sheetStatus(`読み取れませんでした。${vert ? '縦' : '横'}の1行が点線のあいだに収まるように、ズームで大きさを合わせて撮ってください。`, undefined);
    }
  } catch (e) {
    log(`撮影: 失敗 ${e?.message || e}`);
    if (shot !== S.shot) return;
    sheetStatus('読み取りの準備ができませんでした。電波のよい所で、もう一度撮ってください。', undefined);
  }
}

async function setText(text) {
  S.text = text;
  S.tokens = text ? await toTokens(text) : [];
  renderRaw();
  renderChips();
  renderStrip();
}

function openSheet() {
  $('sheet').hidden = false;
  $('controls').hidden = true;
  $('chips').hidden = true;
  $('rawBox').hidden = true;
  showCrop(null);
  renderKanjiSeg();
  renderStatus();
}
// restart: 閉じたらカメラを動かしなおす
function closeSheet(restart = true) {
  S.shot++;
  $('sheet').hidden = true;
  showCrop(null);
  $('controls').hidden = false;
  renderStatus();
  if (Cam.mode === 'video') {
    Cam.unfreeze();
    if (restart && S.view === 'scan') Cam.start();
  }
}

// 読み取りに渡した画像（点線のあいだを切り出して整えたもの）をシートの端に出す。null で消す。
// シートに隠れる帯の下のほうに何が写っていたか、1行が帯に収まっていたか、ぼけていないかを確かめられる
function showCrop(canvas, vert) {
  const box = $('cropBox');
  box.querySelector('canvas')?.remove();
  box.hidden = !canvas;
  $('sheetBody').className = canvas ? (vert ? 'v' : 'h') : '';
  if (canvas) box.append(canvas);
}

// progress: 0〜1 で進み具合の棒、null は棒を動かさない、undefined はくるくると棒を消す（結果の文）
function sheetStatus(msg, progress) {
  const box = $('sheetMsg');
  box.hidden = false;
  $('chips').hidden = true;
  $('sheetMsgText').textContent = msg;
  box.querySelector('.spin').hidden = progress === undefined;
  box.querySelector('.bar').hidden = progress === undefined;
  if (typeof progress === 'number') $('sheetBar').style.width = `${Math.round(progress * 100)}%`;
}

const visibleTokens = () => S.tokens.filter(t => !SET.kanjiOnly || KANJI.test(t.s));
function chipHtml(t) {
  return `<button class="chip" data-word="${esc(t.b)}" data-r="${esc(t.b === t.s ? t.r : '')}"><span class="r">${esc(t.r)}</span><span class="b">${esc(t.s)}</span></button>`;
}
function renderChips() {
  const list = visibleTokens();
  if (!S.tokens.length) return;
  $('sheetMsg').hidden = true;
  $('chips').hidden = false;
  $('chips').innerHTML = list.length ? list.map(chipHtml).join('') : '<p class="empty">漢字のことばはありません</p>';
}
function renderKanjiSeg() {
  document.querySelectorAll('#kanjiSeg button').forEach(b => b.classList.toggle('on', (b.dataset.kanji === '1') === SET.kanjiOnly));
}

/* ===== 読み取った文字を選んで Google で検索する =====
 * 1字ずつタップできるように並べる。1字目をタップしてから2字目をタップすると、そのあいだを選ぶ（なぞっても選べる）。
 * 選んだ1字をもう一度タップすると選ぶのをやめる。選んだ文字は、そのまま Google で検索できる
 */
const SEL = { a: -1, b: -1, drag: false };   // a: 選びはじめの字、b: 選び終わりの字（どちらが前でもよい）

function renderRaw() {
  $('rawBox').hidden = !S.text;
  $('rawText').innerHTML = [...S.text].map((c, i) => `<span data-i="${i}"${/\s/.test(c) ? ' class="sp"' : ''}>${esc(c)}</span>`).join('');
  SEL.a = SEL.b = -1;
  renderSel();
}

function selText() {
  if (SEL.a < 0) return '';
  return [...S.text].slice(Math.min(SEL.a, SEL.b), Math.max(SEL.a, SEL.b) + 1).join('').trim();
}

function renderSel() {
  const lo = Math.min(SEL.a, SEL.b), hi = Math.max(SEL.a, SEL.b);
  $('rawText').querySelectorAll('span').forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle('sel', SEL.a >= 0 && i >= lo && i <= hi);
  });
  const t = selText();
  $('selBar').hidden = !t;
  $('rawHint').hidden = !!t;
  if (!t) return;
  $('selLabel').textContent = `「${t}」を Google で検索`;
  $('selSearch').href = `https://www.google.com/search?q=${encodeURIComponent(t)}`;
}

function onRawDown(e) {
  const el = e.target.closest('#rawText span');
  if (!el) return;
  const i = +el.dataset.i;
  if (SEL.a >= 0 && SEL.a === SEL.b && i !== SEL.a) SEL.b = i;   // 2字目のタップで、そのあいだを選ぶ
  else if (SEL.a === i && SEL.b === i) SEL.a = SEL.b = -1;        // 選んだ1字をもう一度タップで、やめる
  else SEL.a = SEL.b = i;
  SEL.drag = SEL.a >= 0;
  if (SEL.drag) $('rawText').setPointerCapture(e.pointerId);
  renderSel();
}
function onRawMove(e) {
  if (!SEL.drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('#rawText span');
  if (el && +el.dataset.i !== SEL.b) {
    SEL.b = +el.dataset.i;
    renderSel();
  }
}
function onRawUp() {
  SEL.drag = false;
}

/* ===== 辞書を引く =====
 * 国語・漢字 … ウィクショナリー日本語版の「日本語」（1字の漢字は「漢字」も）。項目がなければ Wikipedia の冒頭
 * 英和・和英 … 英語は ウィクショナリー日本語版の「英語」、日本語は ウィクショナリー英語版の「Japanese」
 * Wiki     … Wikipedia 日本語版の冒頭（英語のことばは英語版も）
 * どれも Wikimedia の API（CC BY-SA 4.0）。キーはいらない。
 */
const memo = new Map();
function cached(key, fn) {
  if (!memo.has(key)) memo.set(key, fn().catch(e => { memo.delete(key); throw e; }));
  return memo.get(key);
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const api = (host, params) => `https://${host}/w/api.php?format=json&formatversion=2&origin=*&${params}`;

function wikt(lang, title) {
  return cached(`wikt:${lang}:${title}`, async () => {
    const j = await getJSON(api(`${lang}.wiktionary.org`,
      `action=parse&redirects=1&prop=text&disableeditsection=1&disablelimitreport=1&page=${encodeURIComponent(title)}`));
    if (j.error || !j.parse) return null;      // 項目がない
    return { lang, title: j.parse.title, langs: wiktParse(j.parse.text) };
  });
}
function wikiPage(lang, title) {
  return cached(`wiki:${lang}:${title}`, async () => {
    const j = await getJSON(api(`${lang}.wikipedia.org`,
      `action=query&redirects=1&prop=extracts%7Cpageimages&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=360&titles=${encodeURIComponent(title)}`));
    const p = j.query?.pages?.[0];
    if (!p || p.missing || p.invalid || !p.extract) return null;
    return { lang, title: p.title, extract: p.extract.trim(), thumb: p.thumbnail?.source || '' };
  });
}
function wikiSearch(lang, q) {
  return cached(`search:${lang}:${q}`, async () => {
    const j = await getJSON(api(`${lang}.wikipedia.org`,
      `action=query&list=search&srlimit=8&srprop=snippet&srsearch=${encodeURIComponent(q)}`));
    return (j.query?.search || []).map(x => ({ title: x.title, snippet: htmlText(x.snippet) }));
  });
}
const htmlText = html => new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();
const wiktUrl = (lang, title) => `https://${lang}.wiktionary.org/wiki/${encodeURIComponent(title)}`;
const WIKT_NAME = { ja: 'ウィクショナリー日本語版', en: 'ウィクショナリー英語版' };

/* ウィクショナリーの HTML を、言語の見出し（h2）ごとに分ける。
 * 品詞などの見出しの下の番号付きリスト（ol）を語義として取り出す。
 *   [{ lang: '日本語', blocks: [{ head: '名詞', defs: [{ text, ex, sub, ref }], hw: { text, reading } }], items: [{ head, el }] }]
 */
const SKIP_HEAD = /^(発音|語源|脚注|出典|参考|参照|関連語|派生語|熟語|翻訳|類義語|対義語|上位語|下位語|同音異義語|異表記|活用|成句|コード等|字源|Pronunciation|Etymology|References|Further reading|Anagrams|Conjugation|Inflection|Declension|Usage notes|Synonyms|Antonyms|Derived terms|Related terms|Descendants|Translations|See also|Notes|Alternative forms|Coordinate terms|Hypernyms|Hyponyms|Readings|Compounds)/;

function wiktParse(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  const langs = [];
  let L = null, head = '', lastP = null;
  const walk = parent => {
    for (const el of parent.children) {
      if (el.tagName === 'SECTION') { walk(el); continue; }
      const hd = headingOf(el);
      if (hd) {
        if (hd.lv <= 2) {
          L = { lang: hd.text, blocks: [], items: [] };
          langs.push(L);
          head = '';
        } else if (L) {
          head = hd.text;
        }
        lastP = null;
        continue;
      }
      if (!L) continue;
      L.items.push({ head, el });
      if (el.tagName === 'P') {
        if (el.querySelector('.headword, strong')) lastP = el;
      } else if (el.tagName === 'OL' && !el.classList.contains('references') && !SKIP_HEAD.test(head)) {
        const defs = [...el.children].filter(li => li.tagName === 'LI').map(liToDef).filter(Boolean);
        if (defs.length) {
          // 読みが2つ以上ある見出し（所謂 (しょい 又は いわゆる)）は全部並べる
          const reading = lastP ? [...lastP.querySelectorAll('.headword-tr')].map(txt).filter(Boolean).join('・') : '';
          L.blocks.push({ head, defs, hw: lastP ? { text: txt(lastP), reading } : null });
        }
        lastP = null;
      }
    }
  };
  walk(root);
  return langs;
}

function headingOf(el) {
  let h = el;
  if (el.classList.contains('mw-heading')) h = el.querySelector('h1, h2, h3, h4, h5, h6');
  if (!h || !/^H[1-6]$/.test(h.tagName)) return null;
  return { lv: +h.tagName[1], text: txt(h) };
}

// 要素の文字（ふりがなの rt、注の番号などは除く）
function txt(el) {
  if (!el) return '';
  const c = el.cloneNode(true);
  c.querySelectorAll('rt, rp, sup.reference, .reference, .mw-ref, style, script, .mw-editsection, .noprint').forEach(n => n.remove());
  return c.textContent.replace(/\s+/g, ' ').trim();
}

function liToDef(li) {
  const c = li.cloneNode(true);
  const ex = [], sub = [];
  for (const n of [...c.children]) {
    if (n.tagName === 'OL') {
      // 入れ子の番号付きリストは細かい語義
      for (const d of n.querySelectorAll(':scope > li')) { const t = txt(d); if (t) sub.push(t); }
      n.remove();
    } else if (n.tagName === 'DL' || n.tagName === 'UL') {
      // 用例（長い引用文は出さない）
      for (const d of n.querySelectorAll(':scope > dd, :scope > li')) {
        if (d.querySelector('.citation-whole, .cited-source')) continue;
        const t = txt(d);
        if (t && t.length <= 140) ex.push(t);
      }
      n.remove();
    }
  }
  const text = txt(c);
  if (!text && !sub.length) return null;
  return { text, ex: ex.slice(0, 2), sub, ref: REF_DEF.test(text) ? refTarget(c, text) : null };
}

// 「おさめるを参照。」「ふかめるの漢字表記。」のように、ほかの項目に説明を任せている語義
const REF_DEF = /(を参照|の漢字表記|の異表記|の別表記|の旧字体|の旧表記)。?$/;
// その参照先
function refTarget(li, text) {
  const a = li.querySelector('a[title]:not(.new)');
  if (a) return a.getAttribute('title').replace(/#.*/, '');
  const m = text.match(/「([^」]+)」/);
  return m ? m[1] : null;
}

// 1字の漢字の、音読み・訓読み・部首・意義
function kanjiInfo(page, ch) {
  const kj = page.langs.find(l => l.lang === '漢字'), jp = page.langs.find(l => l.lang === '日本語');
  const k = { ch, on: [], kun: [], meta: '', grade: '', meanings: [] };
  if (kj) {
    k.meta = kj.items.filter(x => !x.head).flatMap(x => [...x.el.querySelectorAll('li')].map(txt))
      .filter(t => /^(部首|総画)/.test(t)).join('、');
    const m = kj.blocks.find(b => b.head === '意義');
    if (m) k.meanings = m.defs;
  }
  const table = jp?.items.find(x => !x.head && x.el.tagName === 'TABLE' && /音|訓/.test(x.el.textContent));
  if (table) {
    for (const tr of table.el.querySelectorAll('tr')) {
      const th = tr.querySelector('th'), td = tr.querySelector('td');
      if (th && !td && !k.grade) k.grade = txt(th);
      if (!th || !td) continue;
      const vals = [...td.querySelectorAll('li')].map(li => txt(li).replace(/表[内外]/g, '').trim()).filter(Boolean)
        .map(v => { const m = v.match(/^(.+?)\s*[:：]\s*(.+)$/); return !m ? v : /訓読み/.test(m[1]) ? m[2] : `${m[2]}（${m[1]}）`; });
      if (/^音/.test(txt(th))) k.on.push(...vals);
      else if (/^訓/.test(txt(th))) k.kun.push(...vals);
    }
  }
  return k.on.length || k.kun.length || k.meanings.length || k.meta ? k : null;
}

const EN_POS = {
  'Noun': '名詞', 'Proper noun': '固有名詞', 'Pronoun': '代名詞', 'Verb': '動詞', 'Adjective': '形容詞', 'Adverb': '副詞',
  'Adnominal': '連体詞', 'Conjunction': '接続詞', 'Interjection': '感動詞', 'Particle': '助詞', 'Auxiliary': '助動詞',
  'Prefix': '接頭辞', 'Suffix': '接尾辞', 'Affix': '接辞', 'Counter': '助数詞', 'Numeral': '数詞', 'Phrase': '句',
  'Proverb': 'ことわざ', 'Idiom': '慣用句', 'Kanji': '漢字', 'Determiner': '限定詞', 'Preposition': '前置詞',
  'Article': '冠詞', 'Contraction': '短縮形', 'Abbreviation': '略語', 'Symbol': '記号', 'Romanization': 'ローマ字',
};
const enPos = head => EN_POS[head.replace(/\s*\d+$/, '')] || head;

const newResult = word => ({ word, reading: '', parts: [], src: [] });
const addSrc = (R, page) => R.src.push({ name: WIKT_NAME[page.lang], title: page.title, url: wiktUrl(page.lang, page.title) });

async function lookupJa(word) {
  const R = newResult(word);
  const page = await wikt('ja', word);
  if (page) {
    if (isSingleKanji(word)) {
      const k = kanjiInfo(page, word);
      if (k) R.parts.push({ kanji: k });
    }
    const jp = page.langs.find(l => l.lang === '日本語');
    const L = jp?.blocks.length ? jp : page.langs.find(l => l.lang === '英語' && l.blocks.length);
    if (L) {
      R.reading = L.blocks.find(b => b.hw?.reading)?.hw.reading || '';
      R.parts.push({ blocks: L.blocks, lang: L === jp ? '' : L.lang, showHw: L !== jp });
      // ほかの項目に説明を任せている語義（〜を参照、〜の漢字表記 など）は、参照先も続けて出す
      const refs = [...new Set(L.blocks.flatMap(b => b.defs.map(d => d.ref)).filter(t => t && t !== page.title))].slice(0, 2);
      for (const t of refs) {
        const p2 = await wikt('ja', t).catch(() => null);
        const L2 = p2?.langs.find(l => l.lang === '日本語');
        if (L2?.blocks.length) {
          R.parts.push({ blocks: L2.blocks, from: p2.title });
          addSrc(R, p2);
        }
      }
    }
    if (R.parts.length) addSrc(R, page);
  }
  if (!R.parts.length) {
    const wp = await wikiPage('ja', word);
    if (wp) {
      R.parts.push({ note: `国語辞典（ウィクショナリー）に「${word}」の項目がないので、Wikipedia の説明を出しています。` }, { wiki: wp });
      R.src.push(wikiSrc(wp));
    }
  }
  return R;
}

// 英語の語の、辞書に載っていそうな形（小文字・複数形や過去形を戻した形）
function englishForms(word) {
  const w = word.trim(), lo = w.toLowerCase(), out = [lo];
  const add = s => { if (s.length > 1 && !out.includes(s)) out.push(s); };
  if (w !== lo) add(w);
  if (/ies$/.test(lo)) add(`${lo.slice(0, -3)}y`);
  if (/(s|x|z|ch|sh)es$/.test(lo)) add(lo.slice(0, -2));
  if (/[^s]s$/.test(lo)) add(lo.slice(0, -1));
  if (/ied$/.test(lo)) add(`${lo.slice(0, -3)}y`);
  if (/ed$/.test(lo)) { if (/(.)\1ed$/.test(lo)) add(lo.slice(0, -3)); add(lo.slice(0, -2)); add(lo.slice(0, -1)); }
  if (/ing$/.test(lo)) { if (/(.)\1ing$/.test(lo)) add(lo.slice(0, -4)); add(lo.slice(0, -3)); add(`${lo.slice(0, -3)}e`); }
  return out.slice(0, 5);
}
// 「dog の複数形」のような変化形しか載っていない項目なら、元の形を返す
function formOf(blocks) {
  let base = null;
  for (const b of blocks) {
    for (const d of b.defs) {
      const m = d.text.match(/^["“]?([A-Za-z][A-Za-z'-]*)["”]?\s*の.*(?:複数形|人称|過去|分詞|比較級|最上級|動名詞|変化形)/);
      if (!m) return null;
      base ||= m[1];
    }
  }
  return base;
}

async function lookupEn(word) {
  const R = newResult(word);
  if (isLatin(word)) {
    // 英和
    for (const w of englishForms(word)) {
      const page = await wikt('ja', w);
      const L = page?.langs.find(l => l.lang === '英語');
      if (!L?.blocks.length) continue;
      R.parts.push({ blocks: L.blocks, from: page.title !== word ? page.title : '', showHw: true });
      addSrc(R, page);
      const base = formOf(L.blocks);
      if (base && base !== page.title) {
        const p2 = await wikt('ja', base).catch(() => null);
        const L2 = p2?.langs.find(l => l.lang === '英語');
        if (L2?.blocks.length) {
          R.parts.push({ blocks: L2.blocks, from: p2.title, showHw: true });
          addSrc(R, p2);
        }
      }
      return R;
    }
    // 日本語の訳がなければ英英
    for (const w of englishForms(word)) {
      const page = await wikt('en', w);
      const L = page?.langs.find(l => l.lang === 'English');
      if (!L?.blocks.length) continue;
      R.parts.push({ note: '日本語の訳が見つからないので、英語での説明（英英）を出しています。' },
                   { blocks: L.blocks, pos: enPos, from: page.title !== word ? page.title : '', showHw: true });
      addSrc(R, page);
      return R;
    }
  } else {
    // 和英
    const page = await wikt('en', word);
    const L = page?.langs.find(l => l.lang === 'Japanese');
    if (L?.blocks.length) {
      R.parts.push({ blocks: L.blocks, pos: enPos });
      addSrc(R, page);
    }
  }
  return R;
}

const wikiSrc = wp => ({ name: wp.lang === 'en' ? 'Wikipedia 英語版' : 'Wikipedia 日本語版', title: wp.title,
                         url: `https://${wp.lang}.wikipedia.org/wiki/${encodeURIComponent(wp.title)}` });

async function lookupWiki(word) {
  const R = newResult(word);
  for (const lang of isLatin(word) ? ['ja', 'en'] : ['ja']) {
    const wp = await wikiPage(lang, word);
    if (wp) {
      R.parts.push({ wiki: wp });
      R.src.push(wikiSrc(wp));
      return R;
    }
  }
  const hits = await wikiSearch('ja', word);
  if (hits.length) R.parts.push({ note: `「${word}」という題の記事はありません。近い記事:` }, { search: hits });
  return R;
}

const LOOKUP = { ja: lookupJa, en: lookupEn, wiki: lookupWiki };

/* ===== 辞書画面 ===== */
async function openWord(word, opts = {}) {
  word = String(word || '').trim();
  if (!word) return;
  const seq = ++S.seq;
  S.cur = { w: word, r: opts.r || '', s: '' };
  if (S.view !== 'dict') show('dict');
  $('q').value = word;
  $('qClear').hidden = false;
  renderHeader();
  renderStrip();
  const body = $('dBody');
  body.innerHTML = '<p class="loading"><span class="spin"></span>調べています…</p>';
  body.scrollTop = 0;
  if (!S.cur.r) {
    readingOf(word).then(r => {
      if (seq !== S.seq || !r || S.cur.r) return;
      S.cur.r = r;
      renderHeader();
      const h = HIST.find(x => x.w === word);
      if (h && !h.r) { h.r = r; save('history', HIST); }
    });
  }
  let R;
  try {
    R = await LOOKUP[SET.dict](word);
  } catch (e) {
    log(`辞書: 失敗 ${e?.message || e}`);
    if (seq !== S.seq) return;
    body.innerHTML = `<div class="empty err"><h2>調べられませんでした</h2><p>通信できませんでした。電波のよい所で、もう一度お試しください。</p><button data-retry>もう一度</button></div>`;
    return;
  }
  if (seq !== S.seq) return;
  if (!S.cur.r && R.reading && SET.dict === 'ja') {
    S.cur.r = R.reading;
    renderHeader();
  }
  if (!R.parts.length) R.split = (await toTokens(word, { join: false })).filter(t => t.b !== word);
  if (seq !== S.seq) return;
  S.cur.s = snippetOf(R);
  renderResult(R);
  if (R.parts.length) addHist({ w: word, r: S.cur.r, d: SET.dict, s: S.cur.s, t: Date.now() });
}

function snippetOf(R) {
  for (const p of R.parts) {
    if (p.kanji) return [p.kanji.on.join('・'), p.kanji.kun.join('・')].filter(Boolean).join(' / ');
    if (p.blocks) {
      // 「〜を参照」だけの語義は飛ばす（参照先の語義が後ろの parts にある）
      const d = p.blocks.flatMap(b => b.defs).find(x => !x.ref);
      if (d) return d.text || d.sub[0] || '';
    }
    if (p.wiki) return p.wiki.extract;
  }
  return '';
}

function renderHeader() {
  const c = S.cur;
  $('dWord').textContent = c ? c.w : '辞書';
  $('dReading').textContent = c?.r && c.r !== c.w ? c.r : '';
  $('btnMark').hidden = $('btnShare').hidden = !c;
  $('btnMark').classList.toggle('on', !!c && MARKS.some(m => m.w === c.w));
}

function renderDictEmpty() {
  renderHeader();
  const recent = HIST.slice(0, 12);
  $('dBody').innerHTML = `<div class="empty"><h2>ことばを調べる</h2>
    <p>「スキャン」で本の文字を撮るか、下の欄にことばを入れてください。上で辞書を切り替えられます。</p>
    <p class="src" style="margin-top:12px">文字の読み取り: <a href="https://github.com/ndl-lab/ndlocr-lite" target="_blank" rel="noopener">NDLOCR-Lite</a>（国立国会図書館、CC BY 4.0）。
    辞書: ウィクショナリー・Wikipedia（CC BY-SA 4.0）</p>
    ${recent.length ? `<div class="recent">${recent.map(h => `<button class="chip" data-word="${esc(h.w)}" data-r="${esc(h.r)}"><span class="r">${esc(h.r)}</span><span class="b">${esc(h.w)}</span></button>`).join('')}</div>` : ''}</div>`;
}

function renderBlocks(p) {
  const label = p.pos || (h => h);
  return `${p.from ? `<p class="from">「${esc(p.from)}」の項目より</p>` : ''}${p.lang ? `<p class="from">${esc(p.lang)}</p>` : ''}` +
    p.blocks.map(b => `<section class="blk">
      <div><span class="pos">${esc(label(b.head) || '意味')}</span>${p.showHw && b.hw?.text ? `<span class="hw">${esc(b.hw.text)}</span>` : ''}</div>
      <ol class="defs${b.defs.length > 1 ? ' num' : ''}">${b.defs.map(d => `<li>
        ${d.text ? `<p>${esc(d.text)}</p>` : ''}${d.sub.map(t => `<p class="sub">${esc(t)}</p>`).join('')}${d.ex.map(t => `<p class="ex">${esc(t)}</p>`).join('')}
      </li>`).join('')}</ol></section>`).join('');
}

function renderKanji(k) {
  const rows = [];
  if (k.on.length) rows.push(['音読み', k.on.join('、')]);
  if (k.kun.length) rows.push(['訓読み', k.kun.join('、')]);
  if (k.meta) rows.push(['部首・画数', k.meta]);
  if (k.grade) rows.push(['区分', k.grade]);
  return `<section class="kcard"><div class="kchar">${esc(k.ch)}</div><div class="kinfo"><dl>
    ${rows.map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>
    ${k.meanings.length ? `<div class="kmean"><span class="pos">意義</span><ol class="defs${k.meanings.length > 1 ? ' num' : ''}">${k.meanings.map(d => `<li><p>${esc(d.text)}</p>${d.sub.map(t => `<p class="sub">${esc(t)}</p>`).join('')}</li>`).join('')}</ol></div>` : ''}
  </div></section>`;
}

function renderWiki(wp) {
  const more = wp.extract.length > 700;
  const text = more ? `${wp.extract.slice(0, 700)}…` : wp.extract;
  const url = `https://${wp.lang}.wikipedia.org/wiki/${encodeURIComponent(wp.title)}`;
  return `<section class="wcard">${wp.thumb ? `<img src="${esc(wp.thumb)}" alt="" loading="lazy">` : ''}
    <h3>${esc(wp.title)}</h3><p>${esc(text)}</p>
    <p><a href="${esc(url)}" target="_blank" rel="noopener">Wikipedia で${more ? '続きを' : ''}読む</a></p></section>`;
}

/* ほかの辞書・Google で調べるリンク。
 * 見つかったとき: 「ほかで調べる」として、コトバンク・Weblio（市販の辞書を収録していて語数が多い）と Google を小さく出す。
 *   内容はアプリに取り込めない（ブラウザから読めず、規約上も）ので、そのことばのページを開くだけ。
 *   コトバンクは載っていない語だと直接のページが 404 になるので、検索のページを開く。
 * 辞書（ウィクショナリー）に語義がなかったとき（notFound）: Google で検索のボタンだけを大きく出す。
 */
function moreLinks(word, notFound) {
  const e = encodeURIComponent(word);
  const q = SET.dict === 'wiki' ? word : SET.dict === 'en' && !isLatin(word) ? `${word} 英語` : `${word} 意味`;
  const google = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  if (notFound) {
    return `<div class="links big"><a href="${esc(google)}" target="_blank" rel="noopener"><svg class="ic"><use href="#i-search"/></svg>「${esc(word)}」を Google で検索</a></div>`;
  }
  const links = [];
  if (SET.dict === 'ja') links.push(['コトバンク', `https://kotobank.jp/search?q=${e}`], ['Weblio', `https://www.weblio.jp/content/${e}`]);
  if (SET.dict === 'en') links.push(['Weblio 英和・和英', `https://ejje.weblio.jp/content/${e}`]);
  links.push(['Google で検索', google]);
  return `<div class="links"><span>ほかで調べる</span>${links.map(([name, url]) =>
    `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}</a>`).join('')}</div>`;
}

function renderResult(R) {
  const html = [];
  for (const p of R.parts) {
    if (p.kanji) html.push(renderKanji(p.kanji));
    else if (p.blocks) html.push(renderBlocks(p));
    else if (p.note) html.push(`<p class="note">${esc(p.note)}</p>`);
    else if (p.wiki) html.push(renderWiki(p.wiki));
    else if (p.search) html.push(`<div class="hits">${p.search.map(h => `<button class="hit" data-word="${esc(h.title)}"><b>${esc(h.title)}</b><small>${esc(h.snippet)}</small></button>`).join('')}</div>`);
  }
  if (!R.parts.length) {
    html.push(`<div class="empty"><h2>見つかりませんでした</h2><p>「${esc(R.word)}」は${SET.dict === 'wiki' ? 'Wikipedia' : 'ウィクショナリー'}に載っていません。</p></div>`);
  }
  // 辞書（ウィクショナリー。Wiki では Wikipedia の記事）になかったときは、Google で検索のボタンを大きく出す
  const noDict = SET.dict === 'wiki' ? !R.parts.some(p => p.wiki) : !R.parts.some(p => p.blocks || p.kanji);
  html.push(moreLinks(R.word, noDict));
  if (!R.parts.length && R.split?.length) html.push(`<p class="from">分けて調べる:</p><div class="split">${R.split.map(chipHtml).join('')}</div>`);
  if (R.src.length) {
    html.push(`<p class="src">出典: ${R.src.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}「${esc(s.title)}」</a>`).join('、')}（CC BY-SA 4.0）</p>`);
  }
  $('dBody').innerHTML = html.join('');
}

function renderStrip() {
  const list = visibleTokens();
  $('stripRow').hidden = !list.length;
  $('strip').innerHTML = list.map(t => `<button data-word="${esc(t.b)}" data-r="${esc(t.b === t.s ? t.r : '')}" class="${S.cur && t.b === S.cur.w ? 'on' : ''}">${esc(t.s)}</button>`).join('');
  $('strip').querySelector('.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function renderFont() {
  $('dBody').className = `fs${SET.font}`;
  document.querySelectorAll('#fontSeg button').forEach(b => b.classList.toggle('on', +b.dataset.font === SET.font));
}

function toggleMark() {
  const c = S.cur;
  if (!c) return;
  const i = MARKS.findIndex(m => m.w === c.w);
  if (i >= 0) MARKS.splice(i, 1);
  else MARKS.unshift({ w: c.w, r: c.r, s: c.s, t: Date.now() });
  save('marks', MARKS);
  renderHeader();
  toast(i >= 0 ? 'ブックマークを外しました' : 'ブックマークしました');
}

async function share() {
  const c = S.cur;
  if (!c) return;
  const url = `${location.origin}${location.pathname}#q=${encodeURIComponent(c.w)}&d=${SET.dict}`;
  const text = `${c.w}${c.r && c.r !== c.w ? `（${c.r}）` : ''}${c.s ? `\n${c.s.slice(0, 120)}` : ''}`;
  if (navigator.share) {
    try { await navigator.share({ title: c.w, text, url }); } catch (e) { /* 閉じただけ */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(`${text}\n${url}`);
    toast('コピーしました');
  } catch (e) {
    toast('共有できませんでした');
  }
}

/* ===== 履歴とブックマーク ===== */
function addHist(entry) {
  HIST = [entry, ...HIST.filter(x => x.w !== entry.w)].slice(0, HIST_MAX);
  save('history', HIST);
}

function when(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}/${d.getDate()}` : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
const DICT_TAG = { ja: '国語', en: '英和', wiki: 'Wiki' };

function renderHist() {
  const marks = S.histTab === 'marks', list = marks ? MARKS : HIST;
  document.querySelectorAll('#histSeg button').forEach(b => b.classList.toggle('on', b.dataset.hist === S.histTab));
  if (!list.length) {
    $('hList').innerHTML = `<p class="empty" style="text-align:center; padding-top:24px">${marks ? '辞書の画面の しおり ボタンで、ことばをブックマークできます。' : 'まだ調べたことばはありません。'}</p>`;
    return;
  }
  $('hList').innerHTML = list.map((x, i) => `<div class="hitem">
      <button class="main" data-open="${i}">
        <span class="w"><b>${esc(x.w)}</b>${x.r && x.r !== x.w ? `<span class="r">${esc(x.r)}</span>` : ''}${!marks && x.d ? `<span class="htag">${DICT_TAG[x.d] || ''}</span>` : ''}<time>${when(x.t)}</time></span>
        <span class="s">${esc(x.s)}</span>
      </button>
      <button class="del" data-del="${i}" aria-label="消す"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>`).join('') + (marks ? '' : '<button class="hclear" id="histClear">履歴をすべて消す</button>');
}

function onHistClick(e) {
  const marks = S.histTab === 'marks', list = marks ? MARKS : HIST;
  const open = e.target.closest('[data-open]'), del = e.target.closest('[data-del]');
  if (open) {
    const x = list[+open.dataset.open];
    if (!x) return;
    if (!marks && x.d) setDict(x.d);
    openWord(x.w, { r: x.r });
  } else if (del) {
    list.splice(+del.dataset.del, 1);
    save(marks ? 'marks' : 'history', list);
    renderHist();
  } else if (e.target.closest('#histClear')) {
    if (!confirm('履歴をすべて消しますか？（ブックマークは残ります）')) return;
    HIST = [];
    save('history', HIST);
    renderHist();
  }
}

/* ===== つなぐ ===== */
function onWordClick(e) {
  const b = e.target.closest('[data-word]');

  $('btnDir').addEventListener('click', () => {
    SET.vert[SET.dict] = !SET.vert[SET.dict];
    saveSet();
    updateDir();
  });
  const pickPhoto = () => $('file').click();
  $('btnPhoto').addEventListener('click', pickPhoto);
  $('camPhoto').addEventListener('click', pickPhoto);

    navigator.clipboard?.writeText(LOGS.join('\n')).then(() => toast('記録をコピーしました'), () => {});
  });
  $('btnBack').addEventListener('click', () => Cam.backToCamera());
  $('file').addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) Cam.openPhoto(f);
    e.target.value = '';
  });
  const cam = $('cam');
  cam.addEventListener('pointerdown', onPointerDown);
  cam.addEventListener('pointermove', onPointerMove);
  cam.addEventListener('pointerup', onPointerUp);
  cam.addEventListener('pointercancel', onPointerUp);
  new ResizeObserver(layoutFrame).observe(cam);

  $('sheetClose').addEventListener('click', () => closeSheet());
  $('chips').addEventListener('click', onWordClick);
  $('rawText').addEventListener('pointerdown', onRawDown);
  $('rawText').addEventListener('pointermove', onRawMove);
  $('rawText').addEventListener('pointerup', onRawUp);
  $('rawText').addEventListener('pointercancel', onRawUp);
  $('selClear').addEventListener('click', () => {
    SEL.a = SEL.b = -1;
    renderSel();
  });
  document.querySelectorAll('#kanjiSeg button').forEach(b => b.addEventListener('click', () => {
    SET.kanjiOnly = b.dataset.kanji === '1';
    saveSet();
    renderKanjiSeg();
    renderChips();
    renderStrip();
  }));

  $('cropBox').addEventListener('click', () => {
    const c = $('cropBox').querySelector('canvas');
    if (!c) return;
    $('cropBigImg').src = c.toDataURL('image/png');
    $('cropBig').hidden = false;
  });
  $('cropBig').addEventListener('click', () => { $('cropBig').hidden = true; });

  $('dBody').addEventListener('click', onWordClick);
  $('strip').addEventListener('click', onWordClick);
  $('stripClear').addEventListener('click', () => { S.tokens = []; S.text = ''; renderStrip(); });
  $('btnMark').addEventListener('click', toggleMark);
  $('btnShare').addEventListener('click', share);
  document.querySelectorAll('#fontSeg button').forEach(b => b.addEventListener('click', () => {
    SET.font = +b.dataset.font;
    saveSet();
    renderFont();
  }));
  $('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    $('q').blur();
    openWord($('q').value);
  });
  $('q').addEventListener('input', () => { $('qClear').hidden = !$('q').value; });
  $('qClear').addEventListener('click', () => {
    $('q').value = '';
    $('qClear').hidden = true;
    $('q').focus();
  });

  document.querySelectorAll('#histSeg button').forEach(b => b.addEventListener('click', () => {
    S.histTab = b.dataset.hist;
    renderHist();
  }));
  $('hList').addEventListener('click', onHistClick);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Cam.stop();
    else if (S.view === 'scan' && $('sheet').hidden) Cam.start();
  });

  log(`起動 ${VERSION}${navigator.standalone ? '（ホーム画面）' : ''} ${navigator.userAgent}`);
  setDict(SET.dict);
  renderFont();
  renderKanjiSeg();

  // 共有されたリンク（…#q=ことば&d=辞書）で開いたときは、そのことばを引く
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('q')) {
    history.replaceState(null, '', location.pathname + location.search);
    if (hash.get('d')) setDict(hash.get('d'));
    openWord(hash.get('q'));
  } else {
    show('scan');     // カメラも動かしはじめる
  }

  // ふつうはカメラが映ってから辞書を読み込みはじめる。カメラの許可を待っているあいだなども、しばらくしたら始める
  setTimeout(preloadAll, 8000);
}

init();
</script>
</body>
</html>
