<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="description" content="本や紙の文字をカメラで撮って、そのまま国語辞典・英和辞典・Wikipedia で調べる辞書アプリ。">
<!-- ホーム画面に追加すると、アドレスバーのない全画面で動きます -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カメラ辞書">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>カメラ辞書</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f4f6f9; --card:#ffffff; --ink:#151a21; --sub:#5b6573; --faint:#8b94a1;
    --line:#dde2e9; --soft:#e8ecf1;
    --accent:#2a7bd4; --accent-ink:#ffffff; --accent-soft:#e1edfa; --link:#1f6fc5;
    --arrow:#ee3a2c;
    --shadow:0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --card:#1a1f26; --ink:#e6eaf0; --sub:#9aa4b2; --faint:#6e7886;
      --line:#2b323c; --soft:#232a33;
      --accent:#5aa2ec; --accent-ink:#06182c; --accent-soft:#1b2d42; --link:#7ab6f3;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html, body{height:100%}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
    font-size:16px; line-height:1.5;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;
         touch-action:manipulation; -webkit-user-select:none; user-select:none}
  button:focus-visible, a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  svg{display:block}
  .ic{width:24px; height:24px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  [hidden]{display:none !important}

  #app{display:flex; flex-direction:column; height:100%; height:100dvh; max-width:640px; margin:0 auto}

  /* ---- 上: 辞書の切り替え ---- */
  #top{flex:none; padding:calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left))}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; padding:3px; border-radius:999px; background:var(--soft)}
  .seg button{height:40px; border-radius:999px; font-size:15px; font-weight:700; color:var(--sub); white-space:nowrap}
  .seg button.on{background:var(--accent); color:var(--accent-ink)}
  .seg.small{display:inline-grid}
  .seg.small button{height:32px; padding:0 12px; font-size:13px; font-weight:600}
  .seg.small button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}

  #main{flex:1; min-height:0; position:relative}
  .view{position:absolute; inset:0; display:flex; flex-direction:column}

  /* ---- スキャン ---- */
  .hint{flex:none; padding:0 12px 8px; text-align:center; font-size:14px; color:var(--sub)}
  #cam{flex:1; min-height:0; position:relative; overflow:hidden; background:#2b2e33; touch-action:none}
  .media{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:50% 50%}
  #frame{position:absolute; border-radius:12px; background:rgba(255,255,255,.1);
         box-shadow:0 0 0 200vmax rgba(0,0,0,.45); pointer-events:none}
  #band{position:absolute; pointer-events:none}
  #frame.v #band{border-left:2px dashed rgba(120,120,120,.95); border-right:2px dashed rgba(120,120,120,.95)}
  #frame.h #band{border-top:2px dashed rgba(120,120,120,.95); border-bottom:2px dashed rgba(120,120,120,.95)}
  #arrow{position:absolute; width:0; height:0; pointer-events:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  #arrow.v{border-left:13px solid transparent; border-right:13px solid transparent; border-top:20px solid var(--arrow)}
  #arrow.h{border-top:13px solid transparent; border-bottom:13px solid transparent; border-left:20px solid var(--arrow)}

  .pillbtn{position:absolute; top:12px; height:44px; padding:0 14px; display:flex; align-items:center; gap:6px;
           border-radius:22px; background:rgba(255,255,255,.95); color:#1b1f24; font-size:15px; font-weight:700;
           box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .pillbtn:active{transform:scale(.96)}
  #btnDir{right:12px}
  #btnBack{left:12px}
  #zoomBadge{position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:2px 10px; border-radius:99px;
             background:rgba(0,0,0,.6); color:#fff; font-size:13px; font-weight:700; pointer-events:none;
             opacity:0; transition:opacity .25s}
  #zoomBadge.show{opacity:1}
  #camStatus{position:absolute; left:50%; bottom:116px; transform:translateX(-50%); max-width:90%; padding:4px 12px; border-radius:99px;
             background:rgba(0,0,0,.6); color:#fff; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none}
  #camMsg{position:absolute; left:20px; right:20px; top:30%; padding:18px; border-radius:16px; text-align:center;
          background:rgba(20,22,26,.85); color:#fff; font-size:15px}
  #camMsg .row{display:flex; gap:8px; justify-content:center; margin-top:12px}
  #camMsg button{height:40px; padding:0 16px; border-radius:20px; background:#fff; color:#1b1f24; font-weight:700}

  #controls{position:absolute; left:0; right:0; bottom:18px; display:flex; justify-content:center; align-items:center; gap:14px}
  .rbtn{width:54px; height:54px; flex:none; display:grid; place-items:center; border-radius:50%;
        background:rgba(255,255,255,.95); color:#1b1f24; box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .rbtn:active{transform:scale(.93)}
  .rbtn.on{background:#ffd54a}
  .rbtn.ghost{visibility:hidden}
  #shutter{width:80px; height:80px; flex:none; border-radius:50%; background:var(--accent);
           border:5px solid rgba(255,255,255,.92); box-shadow:0 0 0 3px var(--accent), 0 4px 14px rgba(0,0,0,.3)}
  #shutter:active{transform:scale(.94)}

  /* 撮ったあとのシート */
  #sheet{position:absolute; left:8px; right:8px; bottom:8px; max-height:72%; display:flex; flex-direction:column;
         padding:12px 14px 4px; border-radius:24px; background:var(--card); box-shadow:0 -4px 24px rgba(0,0,0,.28);
         animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(24px); opacity:0}}
  .sheet-head{flex:none; display:flex; align-items:center; gap:8px}
  .sheet-title{flex:1; display:flex; align-items:center; gap:6px; font-size:17px; font-weight:800}
  /* 読み取った文字。1字ずつタップ（なぞる）で選び、選んだ所を Google で検索する */
  #rawBox{flex:none; margin-top:6px; padding:4px 10px 6px; border-radius:12px; background:var(--soft)}
  .raw-cap{font-size:12px; font-weight:700; color:var(--sub)}
  .raw-cap span{margin-left:4px; font-weight:600; color:var(--faint)}
  #rawText{display:flex; flex-wrap:wrap; max-height:4.2em; overflow:auto; font-size:17px; line-height:1.4; color:var(--ink);
           cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  #rawText span{padding:0 1px}
  #rawText span.sp{min-width:.35em}
  #rawText span.sel{background:var(--accent); color:var(--accent-ink)}
  #selBar{display:flex; align-items:center; gap:4px; margin-top:4px}
  #selBar .ibtn{width:38px; height:38px}
  #selSearch{flex:1; min-width:0; display:flex; align-items:center; gap:6px; height:38px; padding:0 14px; border-radius:19px;
             background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:700; text-decoration:none}
  #selSearch span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* 読み取った範囲（縦書きは左に縦長、横書きは見出しの横に細い帯）と、ことばの一覧 */
  #sheetBody{flex:1; min-height:0; display:flex; gap:12px; margin-top:8px}
  #sheetBody.h{flex-direction:column; gap:6px}
  #sheetMain{flex:1; min-width:0; min-height:0; overflow:auto}
  #cropBox{flex:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint); font-size:10px; font-weight:700; cursor:zoom-in}
  #cropBox canvas{display:block; border:1px solid var(--line); border-radius:6px; background:#fff; object-fit:contain}
  #sheetBody.v #cropBox canvas{height:clamp(90px, 22vh, 170px); width:auto; max-width:64px}
  #sheetBody.h #cropBox{flex-direction:row; gap:8px}
  #sheetBody.h #cropBox span{flex:none}
  #sheetBody.h #cropBox canvas{height:34px; width:auto; min-width:0; max-width:calc(100% - 5em)}
  #chips{padding:2px 0 6px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start}
  #cropBig{align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.88)}
  #cropBig figure{display:flex; flex-direction:column; align-items:center; gap:12px; max-width:100%}
  #cropBigImg{display:block; max-width:92vw; max-height:72vh; object-fit:contain; border-radius:8px; background:#fff}
  #cropBig figcaption{max-width:340px; color:#fff; font-size:13px; text-align:center}
  .chip{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:46px; padding:4px 10px 6px;
        border-radius:12px; background:var(--soft); color:var(--link); line-height:1.15}
  .chip:active{background:var(--accent-soft)}
  .chip .r{min-height:14px; font-size:11px; font-weight:600; opacity:.9}
  .chip .b{font-size:22px; font-weight:700}
  .sheet-msg{padding:20px 4px; color:var(--sub); font-size:15px}
  .sheet-msg .bar{height:4px; margin-top:12px; border-radius:2px; background:var(--soft); overflow:hidden}
  .sheet-msg .bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s}
  .sheet-foot{flex:none; display:flex; align-items:center; justify-content:center; padding-top:2px}
  .tbtn{height:40px; padding:0 14px; display:flex; align-items:center; gap:6px; border-radius:22px; font-weight:700; color:var(--sub)}
  .tbtn:active{background:var(--soft)}

  .spin{display:inline-block; width:16px; height:16px; margin-right:8px; vertical-align:-3px; border-radius:50%;
        border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 辞書 ---- */
  .dhead{flex:none; padding:0 max(12px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); border-bottom:1px solid var(--line)}
  .dtitle{display:flex; align-items:center; gap:2px; min-height:48px}
  .dword{flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; overflow:hidden}
  #dWord{font-size:24px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #dReading{font-size:15px; font-weight:600; color:var(--sub); white-space:nowrap}
  .ibtn{width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:12px}
  .ibtn:active{background:var(--soft)}
  .ibtn.on{color:var(--accent)}
  .ibtn.on .ic{fill:currentColor}
  .fsrow{display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:13px; color:var(--sub)}
  #dBody{flex:1; min-height:0; overflow:auto; padding:16px max(18px, env(safe-area-inset-right)) 28px max(18px, env(safe-area-inset-left)); -webkit-overflow-scrolling:touch}
  #dBody.fs0{font-size:15px} #dBody.fs1{font-size:17px} #dBody.fs2{font-size:20px} #dBody.fs3{font-size:24px}
  .loading{color:var(--sub); font-size:15px}
  .blk{margin-bottom:1.3em}
  .pos{display:inline-block; padding:0 .45em; border-radius:6px; background:var(--ink); color:var(--bg); font-size:.78em; font-weight:700; line-height:1.6}
  .hw{margin-left:.6em; color:var(--sub); font-size:.85em}
  .from{margin-bottom:.4em; color:var(--sub); font-size:.85em}
  ol.defs{list-style:none; margin-top:.45em}
  ol.defs > li{margin-bottom:.6em}
  ol.defs.num{counter-reset:d}
  ol.defs.num > li{counter-increment:d; position:relative; padding-left:1.5em}
  ol.defs.num > li::before{content:counter(d); position:absolute; left:0; top:0; font-weight:800}
  .sub{margin-top:.2em; padding-left:.9em; text-indent:-.9em}
  .sub::before{content:"・"}
  .ex{margin-top:.2em; color:var(--sub); font-size:.88em}
  .ex::before{content:"例"; display:inline-block; margin-right:.4em; padding:0 .3em; border:1px solid var(--line); border-radius:4px; font-size:.8em; vertical-align:.1em}
  .note{margin-bottom:1em; padding:.6em .8em; border-radius:10px; background:var(--soft); color:var(--sub); font-size:.85em}
  .kcard{display:flex; gap:16px; align-items:flex-start; margin-bottom:1.3em; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--card)}
  .kchar{flex:none; width:1.3em; font-size:2.4em; line-height:1.2; text-align:center; font-weight:600;
         font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif}
  .kinfo{flex:1; min-width:0}
  .kcard dl{display:grid; grid-template-columns:auto 1fr; gap:.25em .8em; font-size:.9em}
  .kcard dt{color:var(--sub); font-weight:600; white-space:nowrap}
  .kmean{margin-top:.7em; font-size:.95em}
  .wcard{margin-bottom:1.2em}
  .wcard h3{font-size:1.05em; margin-bottom:.4em}
  .wcard img{float:right; width:36%; max-width:160px; margin:0 0 .5em .8em; border-radius:10px; background:#fff}
  .wcard p{white-space:pre-line}
  .wcard a{color:var(--link); font-weight:700; text-decoration:none}
  .wcard::after{content:""; display:block; clear:both}
  .hits{display:flex; flex-direction:column; gap:8px; margin-bottom:1em}
  .hit{display:block; text-align:left; padding:10px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line)}
  .hit b{display:block; color:var(--link)}
  .hit small{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; color:var(--sub); font-size:.8em; line-height:1.4}
  .split{display:flex; flex-wrap:wrap; gap:8px; margin:.6em 0 1.2em}
  .split .chip .b{font-size:1.15em}
  .links{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:.6em 0 1.2em; font-size:15px}
  .links span{flex-basis:100%; color:var(--sub); font-size:13px; font-weight:600}
  .links a{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:18px; border:1.5px solid var(--accent);
           color:var(--link); font-weight:700; text-decoration:none}
  .links a:active{background:var(--accent-soft)}
  .links.big a{height:44px; padding:0 18px; background:var(--accent); color:var(--accent-ink)}
  .src{font-size:12px; color:var(--faint)}
  .src a{color:inherit}
  .empty{color:var(--sub); font-size:15px}
  .empty h2{font-size:17px; color:var(--ink); margin-bottom:6px}
  .recent{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .err button{margin-top:10px; height:40px; padding:0 16px; border-radius:20px; background:var(--accent); color:var(--accent-ink); font-weight:700}

  .dfoot{flex:none; border-top:1px solid var(--line); background:var(--bg)}
  #stripRow{display:flex; align-items:center}
  #strip{flex:1; min-width:0; display:flex; gap:2px; overflow-x:auto; padding:4px 8px 2px 0; scrollbar-width:none}
  #strip::-webkit-scrollbar{display:none}
  #strip button{flex:none; padding:6px 12px; border-radius:10px; color:var(--link); font-size:18px; font-weight:700; white-space:nowrap}
  #strip button.on{background:var(--accent-soft)}
  #searchForm{position:relative; margin:6px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left))}
  #searchForm .ic{position:absolute; left:14px; top:12px; color:var(--sub)}
  #q{width:100%; height:48px; padding:0 48px 0 46px; border-radius:24px; border:1px solid var(--line);
     background:var(--card); color:var(--ink); font:inherit; font-size:18px; -webkit-appearance:none; appearance:none}
  #q::-webkit-search-cancel-button{display:none}
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px}
  #qClear{position:absolute; right:4px; top:4px; width:40px; height:40px; display:grid; place-items:center; color:var(--sub)}

  /* ---- 履歴 ---- */
  .hhead{flex:none; display:flex; justify-content:center; padding:0 12px 10px}
  #hList{flex:1; min-height:0; overflow:auto; padding:0 max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left))}
  .hitem{display:flex; align-items:center; margin-bottom:8px; border-radius:14px; background:var(--card); border:1px solid var(--line)}
  .hitem .main{flex:1; min-width:0; display:block; padding:10px 4px 10px 14px; text-align:left}
  .hitem .w{display:flex; align-items:baseline; gap:8px}
  .hitem b{font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hitem .r{font-size:13px; color:var(--sub); white-space:nowrap}
  .hitem time{margin-left:auto; font-size:12px; color:var(--faint); white-space:nowrap}
  .hitem .s{display:block; font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hitem .del{width:44px; height:44px; flex:none; display:grid; place-items:center; color:var(--faint)}
  .hitem .del .ic{width:18px; height:18px}
  .hclear{display:block; margin:16px auto 0; height:40px; padding:0 16px; border-radius:20px; color:var(--sub); font-size:14px; font-weight:600}
  .hclear:active{background:var(--soft)}
  .htag{display:inline-block; padding:0 6px; border-radius:6px; background:var(--soft); color:var(--sub); font-size:11px; font-weight:700; vertical-align:2px}

  /* ---- 下: 画面の切り替え ---- */
  #tabs{flex:none; display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;
        padding:6px max(16px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        border-top:1px solid var(--line); background:var(--bg)}
  #tabs button{display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0 4px; border-radius:14px; font-size:12px; font-weight:700; color:var(--sub)}
  #tabs button.on{background:var(--soft); color:var(--ink)}

  /* ---- 読んだ範囲を大きく見る ---- */
  .modal{position:fixed; inset:0; z-index:10; display:flex; align-items:flex-start; justify-content:center;
         padding:calc(40px + env(safe-area-inset-top)) 16px 16px; background:rgba(0,0,0,.4)}

  #debugLog{position:fixed; left:4px; right:4px; top:calc(4px + env(safe-area-inset-top)); z-index:30; max-height:38vh; overflow:auto;
            padding:6px 8px; border-radius:8px; background:rgba(0,0,0,.8); color:#a6f3a6; font:11px/1.4 ui-monospace,Menlo,monospace; white-space:pre-wrap}
  #toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:20; transform:translateX(-50%);
         max-width:86vw; padding:10px 16px; border-radius:12px; background:rgba(20,22,26,.9); color:#fff; font-size:14px; text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3.5 8.5h3.2l1.8-2.8h7l1.8 2.8h3.2v10.8h-17z"/><circle cx="12" cy="13.6" r="3.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5"/><path d="M9 8h6M9 11.5h6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></symbol>
